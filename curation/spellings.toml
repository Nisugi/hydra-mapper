# ------------------------------------------------------------ NOT here
#
# Two kinds of near-duplicate are deliberately left alone.
#
# **The `=~` probes.** 99 tags begin `peer ...` or `set desc on; peer ...`
# and hold a regular expression:
#
#   peer south =~ /Obvious exits: north, south/
#   peer south =~ /^Obvious exits: north, south$/
#
# These are not tags. They are disambiguation probes telling a script how
# to tell apart rooms sharing a title -- four `[Annex, Booth]`, six
# `[Enemy Ship, Quarters]`, five `[The Rift]`. The two spellings above
# differ by `^...$`, which is a different pattern, not a different
# spelling of one: anchoring changes what matches. Merging them would
# change behaviour. They want their own field eventually, not
# normalisation.
#
# **Proper names.** `Whirlin`/`whirlin`, `Sadie`/`sadie`,
# `Khylynnia`/`khylynnia`, `WillowHall`/`Willowhall`, `Gemaneen`,
# `Aramund`, `Leya`, `Khy`, `Mania`. One room each, and capitalisation may
# be carrying meaning -- a person's name against a common noun. Nothing
# breaks by leaving them, and guessing wrong renames someone's house.
