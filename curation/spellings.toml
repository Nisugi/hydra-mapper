# Tag spellings to normalise: 44 families differing only by case, spacing
# or a hyphen.
#
# `retag` rewrites each listed spelling to the canonical one and dedupes,
# so a room carrying both `bardguild` and `bard guild` ends up with one.
#
# # What the split actually costs, which is less than it looks
#
# `docs/room-classification.md` says the guild tags are "the worst" --
# "every guild is split almost exactly in half", so "any consumer
# filtering on `bardguild` silently finds half the bard guilds".
#
# Measured, that is not what is happening. `bardguild` and `bard guild`
# are on the SAME ten rooms, all ten, and so are both rogue guild
# spellings, both locksmith pool spellings, and most of the rest. The
# rooms are double-tagged, not divided. A consumer filtering on either
# spelling finds every one.
#
# Only SIX of the 44 families are genuine splits, where each spelling
# reaches rooms the other does not:
#
#   clericshop      `clericshop` 9 / `cleric shop` 4, only 3 shared
#                   -> 6 rooms reachable by one spelling only
#   pauperslocker   `paupers locker` 2 / `pauperslocker` 1
#   aramund, mania, teashop, fwifestival   one room each
#
# So this pass is mostly hygiene: 1,976 distinct tags is hard to read and
# invites the next person to invent a 45th spelling. `clericshop` is the
# one that fixes a real lookup failure.
#
# # Choosing the canonical spelling
#
# The unspaced form wins, because it is the majority in every family that
# has a majority (`gemshop` 20/1, `pawnshop` 21/2, `publiclockers` 89/2,
# `node` 212/1) and because `;go2` destinations are typed as one word.
# Where a family is an even split -- the guilds, all 9/9 or 10/10 -- the
# unspaced form is chosen for consistency with those.

# ---------------------------------------------------------- the guilds
# All even splits on identical room sets. Redundant, not broken.
[[rename]]
to = "bardguild"
from = ["bard guild"]

[[rename]]
to = "clericguild"
from = ["cleric guild"]

[[rename]]
