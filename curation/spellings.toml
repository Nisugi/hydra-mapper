[[rename]]
to = "rogueguild"
from = ["rogue guild"]

[[rename]]
to = "sorcererguild"
from = ["sorcerer guild", "Sorcerer Guild"]

[[rename]]
to = "warriorguild"
from = ["warrior guild"]

[[rename]]
