# ========================================================= buildings
#
# Rooms of a building, attached to the Official area its front door opens
# onto.
#
# Three things must hold. The group is 20 rooms or fewer, it has an exit
# into an Official area, and that exit is a REAL FRONT DOOR -- an indoor
# room of the group opening onto an outdoor room of the area.
#
# The last test is the one that matters, and it is asked of the graph
# rather than of `location`. A single edge into an area is adjacency, not
# belonging: a Krolvin Warship touches `wehnimers-landing-danjirland` by
# one exit and is an Open Sea Adventures ship instance, not a building in
# Danjirland. It has no doorway, and neither do [The Swale, Plaza Center]
# or [Lumnea Meadow], which are likewise outdoor places that merely abut
# an area.
#
# `location` was tried for this and rejected. It agrees often enough to
# look useful -- it does drop the Krolvin -- but it is missing on 1,608
# rooms, stale on others (the Arena of the Abyss still recorded Caligos
# Isle after the game moved it), and spells one town two ways
# ("Wehnimer's Landing" beside "the town of Wehnimer's Landing"). Gating
# on it dropped 58 of 120 candidates, and 45 of those were real buildings
# whose only fault was the second spelling.

