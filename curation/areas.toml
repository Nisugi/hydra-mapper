# Curated areas: which place each room belongs to.
#
# Seeded from Simutronics' own layout areas -- the 117 in
# `crates/mapper/data/areas.tsv` marked `official layout`, covering 13,689
# rooms. Those are hand-drawn and clean: `wehnimers-landing-catacombs`,
# `-graveyard`, `-old-mine-road`, each a place with its own extent. They
# are not repeated here; this file records only what they do not cover.
#
# # Why the derived areas could not be the seed
#
# `regions::derive_areas` merges adjacent units that share a region, and
# one unlabelled corridor is enough to fuse two towns. Its "Wehnimer's
# Landing" is 3,050 rooms spanning 28 locations -- including 186 rooms of
# Talador, which is how [Road to Talador] came to be drawn in the middle
# of the town square. The Official list splits the same ground into
# `-town` (171), `-outside-gates` (143), `-catacombs` (176) and so on.
#
# # A cave is not a building
#
# The Official areas already make the distinction, and it is not one of
# indoor versus outdoor:
#
#   wehnimers-landing-catacombs   176 indoor,   0 outdoor   an AREA
#   wehnimers-landing-old-mines    57 indoor,   0 outdoor   an AREA
#   wehnimers-landing-town          2 indoor, 169 outdoor   a town
#
# A cave system is a place with its own name and extent. A shop's back
# room is a room of a building, and the building belongs to whatever area
# its front door opens onto. Both are "indoor"; what separates them is
# standing, not sense -- so `[[place]]` and `[[building]]` below are
# different kinds of entry rather than a threshold on one number.
#
# # What is NOT here yet
#
# 214 groups have no verdict, and 36 more are marked `split` in
# `analysis/area-triage.tsv`: several unrelated places welded into one
# group by the interior-doorway grouping, like the 192-room group holding
# Ta'Illistim Keep, the Moonglae Inn, Meazernis Villa and the Lost Home.
# Splitting them by title prefix works cleanly for only 19 of 45, so they
# are left for a person. See the triage sheet.

# ============================================================ places
#
# Areas in their own right: reached from no Official area, large enough to
# be a place rather than a building, and named by one title prefix.

