[[rule]]
verdict = "closed"
title = "[Rumor Woods"
event = "rumor-woods"
note = "The 40-room component with no location set."

# Chronomage Teleportation System: the paid inter-town travel network.
# The 10 rooms (uid 4002910-4002919) are the transport waiting rooms --
# [Wehnimer's Landing Room], [Icemule Trace Room], [Ta'Vaalor Room] and so
# on -- reached from [Swirling Nexus, Transport Hub]. Live in Prime.
#
# Tickets cost 100,000 silvers from a clerk in each town's Chronomage
# office; departures at :00, :20 and :40. A day pass (5,000s) covers
# unlimited travel between two towns in the same zone for 24 hours.
#
# Disconnected only because the edge in is a ticket-raise, not a walk --
# an access condition, like the Quest Nexus token and the Skyship portal.
[[rule]]
verdict = "live"
title = "[Swirling Nexus"
note = "Chronomage transport hub, Prime. Gated by a purchased ticket."

[[rule]]
verdict = "live"
ids = [30596, 30597, 30598, 30599, 30600, 30601, 30602, 30603, 30604]
note = "Chronomage per-destination waiting rooms: Kraken's Fall, Icemule, Ta'Illistim, Ta'Vaalor, Zul Logoth, Kharam Dzu, Solhaven, Wehnimer's, River's Rest."

# ---------------------------------------------------------- ON INSTANCES
# The Chronomage hub above is live in BOTH Prime and Shattered; only the
# price of the edge differs -- 100,000 silvers for a ticket in Prime, free
# in Shattered, where you can simply walk in. That is a property of the
# EDGE and of the character: the access axis, which Cost::Gated and
# tags.lic already model correctly and which the room-classification doc
# says to leave alone. It is not a disposition and needs no per-instance
# status.
#
# Worth writing down because the opposite conclusion looks plausible from
# the data alone: gs.map does mix instances, and meta:game:* marks only 29
# rooms (GSPlat 16, GSX 7, GSF 6), none of them these. If a room is ever
# genuinely gone in one instance and live in another, that gap is real and
# meta:game:<instance> is where it belongs -- but this is not that case.

[[rule]]
verdict = "gone"
location = "Highman Games near Icemule Trace"
note = "Festival last run 2010. All 75 rooms already carry the `closed` tag, but sixteen years with nothing scheduled is not `closed` -- that means shut right now and expected back. Same reasoning as Summit Academy (2017) and Briarmoon Cove (2020)."

# [Zul Logoth, Winding Tunnels] room 4 -- the one `gone`-tagged room in the
# map that HAS a uid, so `require_no_uid` in tags.toml refuses it and it
# needs naming here.
#
# The uid turns out not to mean what it looks like. Room 16918 carries
# seven uids at once (278901, 278903-278907, 278909): the mapper collapsed
# a stretch of identical tunnel into one node. Room 4's uid, 278902, sits
# inside that run, and 16919 holds 278908. So room 4 is a leftover fragment
# of a consolidated tunnel, not a room the game still keeps separately.
#
# The graph agrees. Its single exit leads northwest to 16919, which does
# not point back -- 16919 goes to 9441 instead -- and nothing anywhere
# points at room 4. One-way and unreachable.
[[rule]]
verdict = "gone"
ids = [4]
note = "Unmerged fragment of the multi-uid Winding Tunnels; no return edge, nothing inbound."
