# Disposition rules for gs.map. Applied by `retag` into meta:map:status:*.
#
#   live   = real place; draw and route. The default, never written to a room.
#   closed = exists, shut right now; draw but do not route.
#   gone   = removed from the game; do not draw.
#
# A rule names rooms by `location` or by `title` prefix. Room-level wins
# over area-level; later rules win over earlier ones.
#
# `event = "<name>"` records WHICH paid event an area belongs to, written as
# meta:event:<name>. That is a durable fact; `closed` is not. GemStone runs
# paid events in even months for ~21 days (Feb Duskruin, Apr Rumor Woods,
# Aug Duskruin, Oct Ebon Gate; Rings of Lumnis and Inquisitor Jun/Dec), so
# an event area is open a few weeks a year and shut the rest. A consumer
# answers "is it open now?" from a calendar plus meta:event:*, rather than
# this file being re-curated four times a year.
#
# INVARIANT: a rule may never mark a room `gone` or `closed` if that room is
# reachable by walking from a town centre. Someone can get there, so it is
# live whatever this file says. `retag plan` reports any rule that trips
# this and refuses to apply it.
#
# Reachability IGNORES `event transport` edges. The command only works while
# the event is live, so the edge exists in the map but cannot be traversed
# most of the year. Counting it would make all 1,378 Duskruin, Ebon Gate and
# Evermore Hollow rooms look live year-round. Every other edge counts, and
# gates (profession, race, CHE, society, citizenship) are ignored too --
# the test is whether SOMEONE can walk there, not whether everyone can.


