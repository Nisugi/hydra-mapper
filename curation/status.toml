# ============================================================ round 3

# Quest Nexus: the hub reached by QUEST NEXUS TRANSPORT (a quest token from
# the SIMUCOIN store is required). Leads to the pay quests Night at the
# Academy, Return to Black Swan Castle and Troubled Waters. Live -- the
# token is an access gate, not a disposition, and `QUEST NEXUS STATUS`
# reports all three quests Available.
#
# Consistent with the [Academy, rule above, which marks Night at the
# Academy live.
[[rule]]
verdict = "live"
location = "the Quest Nexus"
note = "Pay-quest hub. Gated by a quest token, which is an access condition (meta), not a status."

# Skyship: Syndicate airship raids. Slaying Empyrean during an active
# Onslaught can open a swirling portal into one; multi-deck combat, groups
# of up to five. Live but gated behind the Onslaught event, which is why
# no ordinary edge reaches it. 72 rooms across 3 components, uid 12102xxx.
[[rule]]
verdict = "live"
title = "[Skyship"
note = "Syndicate airship raid, entered via a portal from Empyrean during an active Onslaught. Gated, not closed."

# Rumor Woods rooms that carry no location; same festival as the 354
